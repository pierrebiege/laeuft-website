<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baar terrain</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
<canvas id="gl"></canvas>
<script src="three.min.js"></script>
<script>
/**
 * Die WM-Strecke in ihrem Gelände. Die Runde selbst ist flach – deshalb
 * ist der Kasten grösser als sie: erst mit dem Baarburg und den Hängen
 * ringsum sieht man, warum sie flach ist. Sie folgt der Lorze durchs Tal.
 *
 * Das Relief ist überhöht (siehe EXAG); bei 274 Höhenmetern auf 4,6 km
 * wäre es sonst kaum zu sehen. Die Beschriftung daneben sagt das.
 *
 * Der Fortschritt kommt per postMessage von der Seite und wird in einer
 * eigenen rAF-Schleife gelesen – so rendert React nichts pro Bild mit.
 */
const S = 120;          // Weltbreite des Geländes
const EXAG = 1.8;       // Überhöhung
const HM = 512;

let rev = 0, target = 0, visible = true, calm = false, needs = true;
/** Beim ersten Bild sofort auf den Stand springen, statt hinzugleiten. */
let snap = true;
addEventListener('message', (e) => {
  if (typeof e.data?.rev === 'number') { target = Math.min(1, Math.max(0, e.data.rev)); needs = true; }
  if (typeof e.data?.visible === 'boolean') visible = e.data.visible;
});

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 4000);

scene.add(new THREE.DirectionalLight(0xfff4e6, 2.2).translateX(-90).translateY(150).translateZ(60));
scene.add(new THREE.HemisphereLight(0xc9dcff, 0x1a1e26, 0.9));
scene.add(new THREE.AmbientLight(0x51617f, 0.45));

function resize() {
  const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  needs = true;
}
addEventListener('resize', resize);

let grid, curve, tube, glow, head, tubeCount = 0, ready = false;

fetch('terrain.json').then((r) => r.json()).then((D) => {
  const uPerM = (S / (D.half * 2)) * EXAG;
  const wY = (e) => (e - D.demMin) * uPerM;
  const at = (x, y) => {
    const fi = ((x + 1) / 2) * (HM - 1), fj = ((1 - y) / 2) * (HM - 1);
    const i0 = Math.floor(fi), j0 = Math.floor(fj), fx = fi - i0, fy = fj - j0;
    const i1 = Math.min(HM - 1, i0 + 1), j1 = Math.min(HM - 1, j0 + 1);
    const g = (i, j) => grid[j * HM + i];
    return g(i0, j0) * (1 - fx) * (1 - fy) + g(i1, j0) * fx * (1 - fy)
      + g(i0, j1) * (1 - fx) * fy + g(i1, j1) * fx * fy;
  };

  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = c.height = HM;
    const cx = c.getContext('2d', { willReadFrequently: true });
    cx.drawImage(img, 0, 0, HM, HM);
    const d = cx.getImageData(0, 0, HM, HM).data;
    grid = new Float32Array(HM * HM);
    for (let p = 0; p < HM * HM; p++) {
      const k = p * 4;
      grid[p] = d[k] * 256 + d[k + 1] + d[k + 2] / 256 - 32768;
    }

    const geo = new THREE.PlaneGeometry(S, S, HM - 1, HM - 1);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    for (let i = 0; i < HM * HM; i++) pos.setY(i, wY(grid[i]));
    pos.needsUpdate = true;
    geo.computeVertexNormals();

    const tex = new THREE.TextureLoader().load('sat.jpg', () => { buildRoute(D, wY, at); needs = true; });
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 8;
    scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 })));
  };
  img.src = 'height.png';
});

function buildRoute(D, wY, at) {
  const raw = D.route.map(([x, y]) => wY(at(x, y)) + 0.35);
  const sm = raw.map((_, i) => {
    let s = 0, n = 0;
    for (let k = -3; k <= 3; k++) { const j = i + k; if (j >= 0 && j < raw.length) { s += raw[j]; n++; } }
    return s / n;
  });
  const pts = D.route.map(([x, y], i) => new THREE.Vector3((x * S) / 2, sm[i], (-y * S) / 2));
  curve = new THREE.CatmullRomCurve3(pts);

  const t = new THREE.TubeGeometry(curve, pts.length * 3, 0.22, 8, false);
  tube = new THREE.Mesh(t, new THREE.MeshBasicMaterial({ color: 0xd8000e, depthTest: false }));
  tube.renderOrder = 10;
  scene.add(tube);

  const g = new THREE.TubeGeometry(curve, pts.length * 3, 0.62, 8, false);
  glow = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color: 0xff4d3d, transparent: true, opacity: 0.28,
    blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false,
  }));
  glow.renderOrder = 9;
  scene.add(glow);

  tubeCount = t.index.count;
  tube.geometry.setDrawRange(0, 0);
  glow.geometry.setDrawRange(0, 0);

  const white = () => new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false });
  const start = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 16), white());
  start.position.copy(pts[0]);
  start.renderOrder = 11;
  scene.add(start);
  head = new THREE.Mesh(new THREE.SphereGeometry(0.62, 16, 16), white());
  head.renderOrder = 12;
  scene.add(head);

  ready = true;
  resize();
  // Die Seite bitten, den aktuellen Stand zu schicken. Wer mitten in den
  // Abschnitt springt, löst danach kein Scroll-Ereignis mehr aus – ohne
  // diese Frage bliebe die Szene auf null stehen.
  parent.postMessage({ sceneReady: true }, '*');
}

const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);

function frame() {
  requestAnimationFrame(frame);
  if (!visible) return;
  const next = calm || snap ? target : rev + (target - rev) * 0.12;
  if (snap && ready) snap = false;
  if (Math.abs(next - rev) > 0.0004) { rev = next; needs = true; }
  if (!needs) return;
  needs = false;

  const e = ease(rev);
  // Sanfter Schwenk, der zurückkehrt, plus leichtes Heranfahren – das Tal
  // bleibt im Bild, die Bewegung kommt vom Punkt, nicht von der Kamera.
  const az = 0.60 + Math.sin(e * Math.PI) * 0.14;
  // Im Hochformat weiter weg, sonst laufen Start und Wendepunkt aus dem Bild.
  const fit = Math.max(1, 1.5 / Math.max(0.4, camera.aspect));
  const r = (74 - e * 8) * fit;
  camera.position.set(r * Math.sin(az), (47 - e * 5) * fit, r * Math.cos(az));
  camera.lookAt(0, 5, 0);

  if (ready) {
    const dc = Math.floor(rev * tubeCount);
    tube.geometry.setDrawRange(0, dc);
    glow.geometry.setDrawRange(0, dc);
    head.position.copy(curve.getPointAt(Math.min(0.9999, Math.max(0.0001, rev))));
    head.visible = rev > 0.002 && rev < 0.998;
  }
  renderer.render(scene, camera);
}

calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Nach aussen sichtbar, damit sich die Szene von der Seite aus prüfen und
// abgreifen lässt (Screenshots, Fehlersuche). Sonst sind alle Namen hier
// script-lokal und von aussen nicht erreichbar.
Object.assign(window, {
  renderer, scene, camera, canvas,
  sceneState: () => ({ rev, target, visible, calm, ready, tubeCount }),
});

resize();
frame();
</script>
